name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Download release payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public
          curl --fail --location \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/MPLAD-SHIELD_payloads.zip" \
            --output /tmp/payloads.zip
          unzip -oq /tmp/payloads.zip -d web/public
          test -s web/public/scored.json
          test -s web/public/work_details.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
